[project]
name = "payo-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "spacy>=3.8.3",
]

[project.optional-dependencies]
full = [
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux'",
    "vllm>=0.34.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["02-llm/scripts"]
testpaths = ["02-llm/scripts/tests"]
